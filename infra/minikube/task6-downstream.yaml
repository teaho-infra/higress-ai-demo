# Task 6: 数据面链路验证 — 转发宿主 downstream(9081)
# via host.minikube.internal -> 192.168.49.1
apiVersion: v1
kind: Service
metadata:
  name: downstream-svc
spec:
  ports:
    - port: 9081
      targetPort: 9081
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Endpoints
metadata:
  name: downstream-svc
subsets:
  - addresses:
      - ip: 192.168.49.1   # host.minikube.internal (minikube -> 宿主 docker bridge gateway)
    ports:
      - port: 9081
        name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-time
  annotations:
    kubernetes.io/ingress.class: higress
spec:
  ingressClassName: higress
  rules:
    - host: demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: downstream-svc
                port:
                  number: 9081