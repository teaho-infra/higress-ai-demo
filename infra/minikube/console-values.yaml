# higress-ai-demo: minikube console deployment (source-built image)
# Chart: higress-console/helm v2.1.0 (image v2.2.4)
global:
  local: true
  ingressClass: "higress"

image:
  repository: higress-console/console
  tag: v2.2.4
  pullPolicy: IfNotPresent

# Built-in Wasm catalog images are mirrored from the pinned v2.2.4 plugin list.
pluginServer:
  imageRegistry: codex-private-wasm-registry.higress-system.svc.cluster.local:5000
  imageNamespace: plugins

podEnvs:
  HIGRESS_ADMIN_WASM_PLUGIN_IMAGE_PULL_SECRET: codex-private-wasm-pull

service:
  type: NodePort
  port: 8080

ingress:
  enabled: true
  domain: console.higress.io
  tlsSecretName: ""
  annotations: {}
  paths:
    - path: /
      pathType: Prefix

o11y:
  enabled: false

grafana:
  enabled: false

prometheus:
  enabled: false

loki:
  enabled: false

certmanager:
  enabled: false
