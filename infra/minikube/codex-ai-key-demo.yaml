apiVersion: v1
kind: ConfigMap
metadata:
  name: codex-ai-mock
  namespace: higress-system
data:
  mock.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != "/healthz":
                self.send_error(404)
                return
            self.send_response(200)
            self.end_headers()

        def do_POST(self):
            if self.path != "/v1/chat/completions":
                self.send_error(404)
                return
            try:
                if self.headers.get("Transfer-Encoding", "").lower() == "chunked":
                    chunks = []
                    while True:
                        size = int(self.rfile.readline().strip().split(b";", 1)[0], 16)
                        if size == 0:
                            self.rfile.readline()
                            break
                        chunks.append(self.rfile.read(size))
                        self.rfile.read(2)
                    body = b"".join(chunks)
                else:
                    size = int(self.headers.get("Content-Length", "0"))
                    body = self.rfile.read(size)
                request = json.loads(body)
            except (ValueError, json.JSONDecodeError):
                print("invalid request body; content-length=%s transfer-encoding=%s" % (
                    self.headers.get("Content-Length"), self.headers.get("Transfer-Encoding")), flush=True)
                self.send_error(400)
                return
            response = {
                "id": "chatcmpl-codex-mock",
                "object": "chat.completion",
                "created": 0,
                "model": request.get("model"),
                "choices": [{
                    "index": 0,
                    "message": {"role": "assistant", "content": "mock-ai-ok"},
                    "finish_reason": "stop"
                }],
                "usage": {"prompt_tokens": 1, "completion_tokens": 1, "total_tokens": 2},
                "codex_debug": {
                    "path": self.path,
                    "host": self.headers.get("Host"),
                    "authorization": self.headers.get("Authorization"),
                    "consumer": self.headers.get("X-Mse-Consumer")
                }
            }
            body = json.dumps(response).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-ai-mock
  namespace: higress-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codex-ai-mock
  template:
    metadata:
      labels:
        app: codex-ai-mock
    spec:
      containers:
        - name: mock
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/mock.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: codex-ai-mock
---
apiVersion: v1
kind: Service
metadata:
  name: codex-ai-mock
  namespace: higress-system
spec:
  selector:
    app: codex-ai-mock
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codex-key-auth-demo
  namespace: higress-system
spec:
  ingressClassName: higress
  rules:
    - host: auth.local
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: codex-xds-echo
                port:
                  number: 5678
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codex-ai-proxy-demo
  namespace: higress-system
spec:
  ingressClassName: higress
  rules:
    - host: ai.local
      http:
        paths:
          - path: /v1/chat/completions
            pathType: Exact
            backend:
              service:
                name: codex-ai-mock
                port:
                  number: 8080
---
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: codex-key-auth
  namespace: higress-system
spec:
  defaultConfig:
    consumers:
      - name: codex-demo
        credential: codex-local-example-key
    global_auth: false
    keys:
      - x-api-key
    in_header: true
  defaultConfigDisable: false
  matchRules:
    - domain:
        - auth.local
        - ai.local
      config:
        allow:
          - codex-demo
  phase: AUTHN
  priority: 310
  url: oci://codex-wasm-registry.higress-system.svc.cluster.local:5000/key-auth:2.2.4
---
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: codex-ai-proxy
  namespace: higress-system
spec:
  defaultConfigDisable: true
  matchRules:
    - domain:
        - ai.local
      config:
        provider:
          type: openai
          apiTokens:
            - mock-upstream-token
          openaiCustomUrl: http://codex-ai-mock.higress-system.svc.cluster.local/v1
          modelMapping:
            demo-model: mock-model
  phase: UNSPECIFIED_PHASE
  priority: 100
  url: oci://codex-wasm-registry.higress-system.svc.cluster.local:5000/ai-proxy:2.2.4
