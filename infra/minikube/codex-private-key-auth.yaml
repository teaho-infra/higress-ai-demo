apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codex-private-key-auth-demo
  namespace: higress-system
spec:
  ingressClassName: higress
  rules:
    - host: private.local
      http:
        paths:
          - path: /private
            pathType: Prefix
            backend:
              service:
                name: codex-xds-echo
                port:
                  number: 5678
---
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: codex-private-key-auth
  namespace: higress-system
spec:
  defaultConfig:
    consumers:
      - name: codex-private-demo
        credential: codex-private-example-key
    global_auth: false
    keys:
      - x-api-key
    in_header: true
  defaultConfigDisable: false
  matchRules:
    - domain:
        - private.local
      config:
        allow:
          - codex-private-demo
  phase: AUTHN
  priority: 310
  imagePullSecret: codex-private-wasm-pull
  url: oci://codex-private-wasm-registry.higress-system.svc.cluster.local:5000/key-auth:2.2.4
