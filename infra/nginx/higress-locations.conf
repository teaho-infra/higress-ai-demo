# Higress Console (:18080) exposed under /higress/ prefix via nginx -> Tailscale Funnel
# console 是无 basePath 的 ice SPA, 静态资源/API 均硬编码在根路径 / 下。
# 方案: /higress/ 剥前缀代理到 console, 并用 sub_filter 把响应里的
#       根路径资源(/css /js /api /higress.jpg) 改写成 /higress/ 前缀,
#       使整个应用跑在 <outer-host>/higress/ 下, 不与其他服务(/multica /wso2)冲突。

# /higress/ 主入口: 剥前缀 -> console :18080/, 并重写内部根路径资源
location /higress/ {
    proxy_pass         http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_redirect     off;

    # 把 console 响应里的根路径资源改写进 /higress/ 前缀 (仅对 HTML + JS, CSS 已由 rewrite 处理)
    sub_filter            '/higress.jpg'  '/higress/higress.jpg';
    sub_filter            '/css/'         '/higress/css/';
    sub_filter            '/js/'          '/higress/js/';
    sub_filter            '/api/'         '/higress/api/';
    sub_filter_last_modified on;
    sub_filter_once       off;
    sub_filter_types      text/javascript application/javascript;
}

# /higress/ 的剥离已由上面的 proxy_pass http://127.0.0.1:18080/ 完成(带 URI 替换前缀),
# 因此 /higress/css/* -> /css/*, /higress/js/* -> /js/*, /higress/api/* -> /api/* 自动正确。