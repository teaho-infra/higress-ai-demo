# Higress Console (:18080) exposed under /higress/ prefix via nginx -> Tailscale Funnel
# console 是无 basePath 的 ice SPA, 静态资源硬编码在根路径 / 下; 生产模式下 API baseURL 为空(""),
# 前端 request 会按当前 origin 的根路径发起(user/session/v1/... 不带 /higress)。
# 方案:
#   A) /higress/ 剥前缀代理到 console + sub_filter 把 HTML/JS 里根路径资源写成 /higress/ 前缀
#   B) 兜底: 把 console 的"根路径 API"显式转发到 console, 避免落到 multica catch-all 404。
#      这些路径在 multica 中不存在专门 location, 前缀/精确匹配优先级高于其 catch-all "/"。

# --- 方案 A: /higress/ 主入口(剥前缀 -> console :18080/, 重写根路径资源) ---

# /higress 无尾斜杠 → 301 到 https://$host/higress/(避免落入 multica catch-all 产生错误重定向;
# 不用相对路径, 因 nginx absolute_redirect(默认on)会把相对转成 http://$host:$server_port 带8443)
location = /higress {
    return 301 https://$host/higress/;
}

location /higress/ {
    proxy_pass         http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    # 关键: 上游(console/Envoy)默认按 Accept-Encoding 返回 gzip, sub_filter 无法处理压缩体。
    # 清掉 Accept-Encoding 让上游返回明文, nginx 先 sub_filter 再自行压缩。
    proxy_set_header   Accept-Encoding   "";
    proxy_redirect     off;

    # 把 console 响应里的根路径资源改写进 /higress/ 前缀 (HTML + JS)
    sub_filter            '/higress.jpg'      '/higress/higress.jpg';
    sub_filter            '/css/'             '/higress/css/';
    sub_filter            '/js/'              '/higress/js/';
    sub_filter            '/api/'             '/higress/api/';
    sub_filter            '/user'             '/higress/user';
    sub_filter            '/session'          '/higress/session';
    sub_filter            '/system'           '/higress/system';
    sub_filter            '/dashboard'        '/higress/dashboard';
    sub_filter            '/landing'          '/higress/landing';
    sub_filter            '/v1/'              '/higress/v1/';
    sub_filter            '/healthz'          '/higress/healthz';
    sub_filter_last_modified on;
    sub_filter_once       off;
    sub_filter_types      text/javascript application/javascript;
}

# --- 方案 B: console 根路径 API 兜底(显式转发 console, 不落 multica) ---
#   用于前端在生产模式(baseURL="")误从根路径发起请求时, 仍能命中 console 而非 multica。
#   这些是 console 的 API/页面路径, multica 中无同名专门 location, 不会被抢。
#   注意: /api, /js, /css, 由上面的 /higress/ 前缀与 multica 的 /api(/@ 不冲突)处理。

# 精确匹配单段路径(避免吞掉 multica 深层路由)
location = /healthz { proxy_pass http://127.0.0.1:18080/healthz; proxy_set_header Host $host; }
location = /landing { proxy_pass http://127.0.0.1:18080/landing; proxy_set_header Host $host; }

# 前缀匹配 console 的 API 命名空间(这些前缀在 multica 里没有专门路由)
location ^~ /user/      { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; }
location ^~ /session/   { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; }
location ^~ /system/    { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; }
location ^~ /dashboard/ { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; }
location ^~ /v1/        { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; }