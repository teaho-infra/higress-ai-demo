# Higress Console (:18080) exposed under /higress/ prefix via nginx -> Tailscale Funnel
# console 前端已配置 publicPath=/higress/ + router.basename=/higress (见 ice.config.mts / src/app.ts),
# 因此 HTML/JS 静态资源自带 /higress/ 前缀, nginx 不必再用 sub_filter 重写静态路径(否则会双重前缀)。
# 生产模式 API baseURL 仍为空(""), 前端运行时按当前 origin 根路径发 API(user/session/v1/... 不带 /higress),
# 故仍需"根路径 API 兜底"把它们转发到 console, 避免落到 multica catch-all 404。

# --- 主入口: /higress/
# /higress 无尾斜杠 → 301 到 https://$host/higress/(避免落入 multica catch-all 产生错误重定向;
# 不用相对路径, 因 nginx absolute_redirect(默认on)会把相对转成 http://$host:$server_port 带8443)
location = /higress {
    return 301 https://$host/higress/;
}

location /higress/ {
    proxy_pass         http://127.0.0.1:18080/;   # 剥 /higress/ 前缀 -> console 根
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_redirect     off;
}

# --- 方案 B: console 根路径 API 兜底(显式转发 console, 不落 multica) ---
#   用于前端在生产模式(baseURL="")误从根路径发起请求时, 仍能命中 console 而非 multica。
#   这些是 console 的 API/页面路径, multica 中无同名专门 location, 不会被抢。

# 精确匹配单段路径(避免吞掉 multica 深层路由)
location = /healthz { proxy_pass http://127.0.0.1:18080/healthz; proxy_set_header Host $host; }
location = /landing { proxy_pass http://127.0.0.1:18080/landing; proxy_set_header Host $host; }

# console 前端 401 → 硬编码跳 /login?redirect= (旧版前端)。
# 新版前端已改跳 basename 前缀 /higress/login(见 request.tsx 401 分支), 走上面的 /higress/ 前缀即可。
# 此处兜底保留: 当 redirect 指回 /higress 时把它导回 console 登录页, 避免落 multica。
location = /login {
    if ($arg_redirect ~* ^/higress) {
        return 302 https://leonbook5-jiguang-series.tailb1426a.ts.net/higress/login?redirect=$arg_redirect;
    }
    include            /home/leonbook5/.local/nginx/conf/multica-front.inc;
    proxy_pass         http://multica_frontend;
}

# 前缀匹配 console 的 API 命名空间(这些前缀在 multica 里没有专门路由)
location ^~ /user/      { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; }
location ^~ /session/   { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; }
location ^~ /system/    { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; }
location ^~ /dashboard/ { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; }
location ^~ /v1/        { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; }