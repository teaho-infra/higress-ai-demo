apiVersion: apps/v1
kind: Deployment
metadata:
  name: leon-hello-backend
  namespace: higress-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leon-hello-backend
  template:
    metadata:
      labels:
        app: leon-hello-backend
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:5678", "-text=hello-from-backend"]
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: leon-hello-backend
  namespace: higress-system
spec:
  selector:
    app: leon-hello-backend
  ports:
    - port: 5678
      targetPort: 5678
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leon-hello-route
  namespace: higress-system
spec:
  ingressClassName: higress
  rules:
    - host: wasm-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: leon-hello-backend
                port:
                  number: 5678
