server:
  port: 8088
  address: 127.0.0.1

spring:
  application:
    name: spring-ai-demo
  main:
    web-application-type: servlet

  ai:
    openai:
      # 指向豆包 Ark Coding 端点 (OpenAI 兼容)
      # Key 通过 OPENAI_API_KEY 环境变量注入(不进 git)
      api-key: ${OPENAI_API_KEY:dev-key-placeholder}
      base-url: ${OPENAI_BASE_URL:https://ark.cn-beijing.volces.com/api/coding/v3}
      chat:
        # 实际可用的模型见 infra/ark-validation.md
        # 优先 deepseek-v4-flash-ga-260731(快) 或 glm-5-2(强)
        options:
          model: ${OPENAI_MODEL:deepseek-v4-flash-ga-260731}
          temperature: 0.7

    # MCP client: stdio 模式,启动两个本地 Python MCP server
    # CONFIG_PREFIX = "spring.ai.mcp.client"
    # 顶层 enabled/type/name/version/... 在 mcp.client.common
    # stdio.connections 是个 Map<String, Parameters(command, args, env)>
    mcp:
      client:
        enabled: true
        name: spring-ai-demo-mcp-client
        version: 0.1.0
        request-timeout: 30s
        type: SYNC
        stdio:
          connections:
            rss-fetcher:
              command: /home/leonbook5/.hermes/bin/uv
              args:
                - run
                - --project
                - ${user.dir}/../mcp-servers/rss-fetcher
                - python
                - -m
                - rss_fetcher.server
              env: {}
            notifier:
              command: /home/leonbook5/.hermes/bin/uv
              args:
                - run
                - --project
                - ${user.dir}/../mcp-servers/notifier
                - python
                - -m
                - notifier.server
              env:
                ECHO_SERVER_URL: ${ECHO_SERVER_URL:http://localhost:9999/echo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.springframework.ai: DEBUG
    com.example.aicuration: DEBUG
