[project]
name = "rss-fetcher"
version = "0.1.0"
description = "MCP server that fetches RSS feeds and exposes search/list tools for AI agents"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0",
    "httpx>=0.27",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rss_fetcher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
